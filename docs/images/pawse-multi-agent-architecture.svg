<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1910" viewBox="0 0 1200 1910" role="img" aria-labelledby="title desc">
<title id="title">Pawse multimodal multi-agent architecture</title>
<desc id="desc">Target design with current integration labels. Voice uses Gemini 3.8 Live. Vision and Document use Gemini 3.8 Flash. The Orchestrator routes validated tools for care, clinic discovery and policy evidence. Documents feed cited retrieval. German script drafting and separate Gradium own-voice enrollment lead to owner review, German speech and a care handoff. Document ingestion, private RAG, video and telephone execution still need integration.</desc>
