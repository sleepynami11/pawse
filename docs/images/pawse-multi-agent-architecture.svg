<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
<title id="title">Pawse multi-agent architecture</title>
<desc id="desc">Seven runtime roles. Intake branches into parallel Gemini care guidance and clinic retrieval. Retrieved clinics pass through deterministic ranking. The Python orchestrator merges guidance and ranked clinics into a care summary and trace. Policy evidence is a separate synthetic-only API. Reviewed communication uses Gemini and Gradium through separate calls. Telephone transport, appointments, calendar and taxi integrations are future work.</desc>
