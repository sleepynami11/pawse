<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1450" viewBox="0 0 1080 1450" role="img" aria-labelledby="title desc">
<title id="title">Pawse multi-agent workflow</title>
<desc id="desc">Intake and safety branches into parallel Care Guidance and Vet Discovery agents. Clinic results pass through Ranking. A Python Orchestrator combines available guidance and clinics into the care summary. Policy Evidence is a separate synthetic-only retrieval tool. After owner review, Communication uses Gemini and Gradium to create a German script and owner-consented audio. Calls and bookings are future integrations.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#927888"/></marker><marker id="pinkArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#D72B77"/></marker></defs>
<rect width="1080" height="1450" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="540" y="62" font-size="40" font-weight="700" text-anchor="middle" fill="#27232A">Pawse Multi-Agent Workflow</text>
<text x="540" y="102" font-size="24" font-weight="400" text-anchor="middle" fill="#6A616B">Understand the concern. Find care. Prepare the conversation.</text>
<path d="M236 136 H283" fill="none" stroke="#927888" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="299" y="143" font-size="21" font-weight="400" text-anchor="start" fill="#6A616B">Care workflow</text>
<path d="M560 136 H607" fill="none" stroke="#D72B77" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#pinkArrow)" stroke-dasharray="9 8"/>
<text x="623" y="143" font-size="21" font-weight="400" text-anchor="start" fill="#6A616B">Reviewed follow-up</text>
<rect x="270" y="180" width="540" height="82" rx="18" fill="#F3F0F3" stroke="#DCD3DA" stroke-width="2"/>
<text x="540" y="214" font-size="28" font-weight="700" text-anchor="middle" fill="#27232A">Owner input</text>
<text x="540" y="244" font-size="23" font-weight="400" text-anchor="middle" fill="#6A616B">Text · photo · transcribed speech</text>
<path d="M540 262 V306" fill="none" stroke="#927888" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<g data-agent-id="intake">
<rect x="270" y="306" width="540" height="106" rx="18" fill="#FCFAFB" stroke="#DCD3DA" stroke-width="2"/>
<circle cx="298" cy="334" r="16" fill="#D72B77"/>
<text x="298" y="340" font-size="18" font-weight="700" text-anchor="middle" fill="white">1</text>
<text x="540.0" y="354" font-size="28" font-weight="700" text-anchor="middle" fill="#27232A">Intake &amp; Safety Agent</text>
<text x="540.0" y="390" font-size="23" font-weight="400" text-anchor="middle" fill="#6A616B">Validate input and sharing consent</text>
</g>
<path d="M540 412 V446 H280 V488" fill="none" stroke="#927888" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M540 446 H800 V488" fill="none" stroke="#927888" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="443" y="428" width="194" height="36" rx="18" fill="#FBEAF2" stroke="#FBEAF2" stroke-width="2"/>
<text x="540" y="453" font-size="19" font-weight="700" text-anchor="middle" fill="#D72B77">IN PARALLEL</text>
<g data-agent-id="care_guidance">
<rect x="60" y="488" width="440" height="140" rx="18" fill="#FCFAFB" stroke="#DCD3DA" stroke-width="2"/>
<circle cx="88" cy="516" r="16" fill="#D72B77"/>
<text x="88" y="522" font-size="18" font-weight="700" text-anchor="middle" fill="white">2</text>
<text x="280.0" y="536" font-size="28" font-weight="700" text-anchor="middle" fill="#27232A">Care Guidance Agent</text>
<text x="280.0" y="572" font-size="23" font-weight="400" text-anchor="middle" fill="#6A616B">Gemini</text>
<text x="280.0" y="602" font-size="23" font-weight="400" text-anchor="middle" fill="#6A616B">Questions to prepare for the vet</text>
</g>
<g data-agent-id="nearby_vets">
<rect x="580" y="488" width="440" height="140" rx="18" fill="#FCFAFB" stroke="#DCD3DA" stroke-width="2"/>
<circle cx="608" cy="516" r="16" fill="#D72B77"/>
<text x="608" y="522" font-size="18" font-weight="700" text-anchor="middle" fill="white">3</text>
<text x="800.0" y="536" font-size="28" font-weight="700" text-anchor="middle" fill="#27232A">Vet Discovery Agent</text>
<text x="800.0" y="572" font-size="23" font-weight="400" text-anchor="middle" fill="#6A616B">Clinic data</text>
<text x="800.0" y="602" font-size="23" font-weight="400" text-anchor="middle" fill="#6A616B">Nearby clinics + contact details</text>
</g>
<path d="M800 628 V670" fill="none" stroke="#927888" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<g data-agent-id="ranking">
<rect x="580" y="670" width="440" height="110" rx="18" fill="#FCFAFB" stroke="#DCD3DA" stroke-width="2"/>
<circle cx="608" cy="698" r="16" fill="#D72B77"/>
<text x="608" y="704" font-size="18" font-weight="700" text-anchor="middle" fill="white">4</text>
<text x="800.0" y="718" font-size="28" font-weight="700" text-anchor="middle" fill="#27232A">Ranking Agent</text>
<text x="800.0" y="754" font-size="23" font-weight="400" text-anchor="middle" fill="#6A616B">Hours → distance → rating</text>
</g>
<path d="M280 628 V810 H540 V846" fill="none" stroke="#927888" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M800 780 V810 H540" fill="none" stroke="#927888" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g data-agent-id="orchestrator">
<rect x="270" y="846" width="540" height="128" rx="18" fill="#FBEAF2" stroke="#E9B7CF" stroke-width="2"/>
<circle cx="298" cy="874" r="16" fill="#D72B77"/>
<text x="298" y="880" font-size="18" font-weight="700" text-anchor="middle" fill="white">5</text>
<text x="540.0" y="894" font-size="32" font-weight="700" text-anchor="middle" fill="#27232A">Orchestrator</text>
<text x="540.0" y="930" font-size="23" font-weight="400" text-anchor="middle" fill="#6A616B">Python · combine available results</text>
<text x="540.0" y="960" font-size="23" font-weight="400" text-anchor="middle" fill="#6A616B">Keep missing information explicit</text>
</g>
<path d="M540 974 V1012" fill="none" stroke="#927888" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="270" y="1012" width="540" height="84" rx="18" fill="#FBEAF2" stroke="#E9B7CF" stroke-width="2"/>
<text x="540" y="1048" font-size="27" font-weight="700" text-anchor="middle" fill="#27232A">Care summary + ranked clinics</text>
<text x="540" y="1080" font-size="23" font-weight="400" text-anchor="middle" fill="#6A616B">Guidance · contacts · next steps</text>
<text x="60" y="1155" font-size="22" font-weight="700" text-anchor="start" fill="#D72B77">SEPARATE TOOLS</text>
<text x="60" y="1187" font-size="22" font-weight="400" text-anchor="start" fill="#6A616B">Requested independently</text>
<path d="M810 1054 H1046 V1260 H1020" fill="none" stroke="#D72B77" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#pinkArrow)" stroke-dasharray="9 8"/>
<text x="816" y="1155" font-size="22" font-weight="700" text-anchor="middle" fill="#D72B77">Owner review</text>
<text x="816" y="1187" font-size="22" font-weight="400" text-anchor="middle" fill="#6A616B">+ separate consent</text>
<g data-agent-id="policy_evidence">
<rect x="60" y="1212" width="440" height="142" rx="18" fill="#FCFAFB" stroke="#DCD3DA" stroke-width="2"/>
<circle cx="88" cy="1240" r="16" fill="#D72B77"/>
<text x="88" y="1246" font-size="18" font-weight="700" text-anchor="middle" fill="white">6</text>
<text x="280.0" y="1260" font-size="27" font-weight="700" text-anchor="middle" fill="#27232A">Policy Evidence Agent</text>
<text x="280.0" y="1296" font-size="23" font-weight="400" text-anchor="middle" fill="#6A616B">Cited policy snippets</text>
<text x="280.0" y="1326" font-size="23" font-weight="400" text-anchor="middle" fill="#6A616B">Synthetic demo corpus only</text>
</g>
<g data-agent-id="communication">
<rect x="580" y="1212" width="440" height="142" rx="18" fill="#FCFAFB" stroke="#DCD3DA" stroke-width="2"/>
<circle cx="608" cy="1240" r="16" fill="#D72B77"/>
<text x="608" y="1246" font-size="18" font-weight="700" text-anchor="middle" fill="white">7</text>
<text x="800.0" y="1260" font-size="27" font-weight="700" text-anchor="middle" fill="#27232A">Communication Agent</text>
<text x="800.0" y="1296" font-size="23" font-weight="400" text-anchor="middle" fill="#6A616B">Gemini + Gradium</text>
<text x="800.0" y="1326" font-size="23" font-weight="400" text-anchor="middle" fill="#6A616B">German script + own-voice audio</text>
</g>
<text x="540" y="1405" font-size="23" font-weight="400" text-anchor="middle" fill="#6A616B">Future: phone calls · appointments · calendar · taxi</text>
</g></svg>
